[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molmopoint-quantization"
version = "0.1.0"
description = "Reproducible INT4 and INT8 releases for AllenAI MolmoPoint-8B"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "absl-py",
  "accelerate>=1.10,<2",
  "bitsandbytes==0.50.0",
  "cached-path>=1.6.4",
  "cached-property",
  "datasets>=3.6,<4",
  "decord2>=0.1",
  "editdistance",
  "einops>=0.8",
  "einops-exts",
  "fiddle>=0.2.5",
  "huggingface-hub>=0.34,<2",
  "httpx>=0.27,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "omegaconf",
  "openai>=1,<3",
  "pillow>=10,<13",
  "pyarrow>=18.1,<19",
  "pytest>=8,<10",
  "pyyaml>=6,<7",
  "ruff>=0.12,<1",
  "scipy>=1.11,<2",
  "sentencepiece",
  "torch>=2.6",
  "torchmetrics",
  "torchvision>=0.21",
  "tqdm>=4.66,<5",
  "transformers==4.57.1",
]

[project.scripts]
molmo-quantize = "quantize:main"
molmo-evaluate = "evaluate:main"

[tool.setuptools]
py-modules = ["molmo_common", "quantize", "evaluate"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
